version: '3.8'

services:
  diabetes-app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # Persist trained models
      - ./rag/vector_store:/app/rag/vector_store  # Persist ChromaDB index
      - ./data:/app/data              # Dataset access
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
